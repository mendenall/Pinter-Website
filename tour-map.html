<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2026 Tour Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      position: relative;
      font-family: Arial, sans-serif;
    }

    /* MAP FULLSCREEN */
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* FLOATING CONTROLS */
    .controls {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      transform: translateX(0%);
      z-index: 10;

      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      padding: 7px 10px;

      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);

      font-size: 0.85rem;
    }

    .controls label {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .controls input {
      margin-right: 4px;
      cursor: pointer;
    }

    .controls button {
      margin-left: 12px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.6);
      color: #ff00d4;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius:6px;
      backdrop-filter: blur(4px);
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .controls button:hover {
      background: rgba(255,0,212,0.2);
    }

    /* Popup fix */
    .mapboxgl-popup-content {
      color: #000;
      font-size: 14px;
      line-height: 1.4;
    }

    .mapboxgl-popup-content strong {
      font-size: 15px;
    }

    /* MOBILE TWEAK */
    @media (max-width: 900px) {
      .controls {
        justify-content: center;
            /* Move to bottom */
        top: auto;       /* unset top */
        bottom: 0px;    /* adjust spacing from bottom as needed */

      }
  </style>

</head>
<body>

  <div class="controls">
    <!-- 80s neon month colors -->
    <label style="color:#FF073A"><input type="checkbox" data-month="0" checked> Jan</label>
    <label style="color:#FF8C00"><input type="checkbox" data-month="1" checked> Feb</label>
    <label style="color:#FFD700"><input type="checkbox" data-month="2" checked> Mar</label>
    <label style="color:#39FF14"><input type="checkbox" data-month="3" checked> Apr</label>
    <label style="color:#00FFFF"><input type="checkbox" data-month="4" checked> May</label>
    <label style="color:#1E90FF"><input type="checkbox" data-month="5" checked> Jun</label>
    <label style="color:#DA70D6"><input type="checkbox" data-month="6" checked> Jul</label>
    <label style="color:#FF00FF"><input type="checkbox" data-month="7" checked> Aug</label>
    <label style="color:#FF1493"><input type="checkbox" data-month="8" checked> Sep</label>
    <label style="color:#00FF7F"><input type="checkbox" data-month="9" checked> Oct</label>
    <label style="color:#FF4500"><input type="checkbox" data-month="10" checked> Nov</label>
    <label style="color:#7FFF00"><input type="checkbox" data-month="11" checked> Dec</label>

    <!-- Past toggle -->
    <label style="margin-left:16px; color:#ccc">
      <input type="checkbox" id="togglePast">
      Show past dates
    </label>

    <!-- Clear/Show all -->
    <button id="toggleFilters" style="
      margin-left:16px;
      padding:4px 10px;
      background: rgba(0,0,0,0.6);
      color: #ff00d4;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius:6px;
      backdrop-filter: blur(4px);
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    ">Clear All</button>
  </div>

  <div id="map"></div>

  <!-- Mapbox JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="map.js?v=6"></script>


</body>
</html>
